# Arbitrary-length multi-camera configuration.
# Keep sample entries disabled until serial numbers and calibration URLs are replaced.
defaults:
  transport: usb
  output_encoding: rgb8
  use_sensor_data_qos: true
  grab_timeout_ms: 1000
  reconnect_interval_ms: 1000
  max_consecutive_timeouts: 5
  sdk_buffer_count: 4
  auto_exposure: false
  exposure_time: 6000.0
  auto_gain: false
  gain: 0.0
  frame_rate: 0.0
  trigger_mode: "off"

cameras:
  - enabled: true
    namespace: left_camera
    node_name: driver
    serial_number: 00DA1701234
    camera_name: left_camera
    frame_id: left_camera_optical_frame
    camera_info_url: ""

  - enabled: true
    namespace: right_camera
    node_name: driver
    serial_number: 00DA1923281
    camera_name: right_camera
    frame_id: right_camera_optical_frame
    camera_info_url: ""
